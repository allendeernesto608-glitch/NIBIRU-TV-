<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>Mi IPTV</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>tailwind.config={theme:{extend:{colors:{nf:'#E50914',ink:'#141414',panel:'#1b1b1b'}}}};</script>
<style>
  html,body{background:#141414;color-scheme:dark}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .app{height:100vh;height:100dvh}
  .scroll::-webkit-scrollbar{width:8px}
  .scroll::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:8px}
  .scroll{scrollbar-width:thin;scrollbar-color:#3a3a3a transparent}
  :focus-visible{outline:3px solid #fff;outline-offset:-3px}
  video{background:#000}
  summary{list-style:none}summary::-webkit-details-marker{display:none}
  section{content-visibility:auto;contain-intrinsic-size:0 48px}
  .tab{flex:none;border-radius:999px;padding:.375rem .75rem;background:#2a2a2a;color:#bbb;font-size:.8rem}
  .tab[aria-selected=true]{background:#fff;color:#000;font-weight:600}
  .tab span{opacity:.6;margin-left:.25rem}
  .rc{border:1px solid rgba(255,255,255,.2);border-radius:.25rem;padding:.375rem .5rem;font-size:.75rem}
  .rc:hover{background:rgba(255,255,255,.1)}
  /* Modo menú en pantalla (TV y celular horizontal) */
  .ov .app{flex-direction:row}
  .ov main{position:relative;flex:1;height:100%;min-width:0;padding-top:0}
  .ov main>div:first-child{flex:1;aspect-ratio:auto;min-height:0}
  .ov aside{position:fixed;top:0;bottom:0;left:0;width:min(92vw,400px);z-index:30;flex:none;background:rgba(20,20,20,.95);transform:translateX(-105%);transition:transform .2s}
  .ov.menu aside{transform:none}
  .ov aside header{max-height:50%;overflow-y:auto}
  .ov #bar{position:absolute;left:0;right:0;bottom:0;z-index:20;background:rgba(0,0,0,.78);opacity:0;pointer-events:none;transition:opacity .2s}
  .ov.info #bar,.ov.menu #bar{opacity:1;pointer-events:auto}
  .tv #tools{display:none}
  .tv #overlayText{font-size:2.25rem;line-height:1.3;max-width:40ch}
</style>
</head>
<body class="text-neutral-100">
<div class="app flex flex-col lg:flex-row overflow-hidden">

  <aside class="order-2 lg:order-1 lg:w-[400px] lg:shrink-0 flex-1 min-h-0 flex flex-col bg-panel border-t lg:border-t-0 lg:border-r border-white/10">
    <header class="px-4 pt-3 pb-2 space-y-2 border-b border-white/10">
      <div class="flex items-center justify-between">
        <h1 class="text-2xl font-black tracking-tight text-nf">MI IPTV</h1>
        <button id="clear" class="hidden text-xs text-neutral-400 hover:text-white underline underline-offset-2">Borrar lista</button>
      </div>

      <details id="tools" open>
        <summary class="cursor-pointer select-none py-1 text-sm text-neutral-300">Lista y TV</summary>
        <div class="space-y-3 pt-3">
          <div class="flex gap-2">
            <input id="url" type="url" inputmode="url" placeholder="URL de la lista M3U" class="min-w-0 flex-1 rounded bg-neutral-800 border border-white/10 px-3 py-2 text-sm placeholder-neutral-500 focus:border-white/40 focus:outline-none">
            <button id="load" class="rounded bg-nf hover:bg-red-700 px-4 py-2 text-sm font-semibold transition-colors">Cargar</button>
          </div>
          <div class="flex gap-2">
            <select id="country" class="min-w-0 flex-1 rounded bg-neutral-800 border border-white/10 px-2 py-2 text-sm">
              <option value="">Canales públicos por país…</option>
              <option value="es">España</option><option value="mx">México</option><option value="pe">Perú</option>
              <option value="co">Colombia</option><option value="ar">Argentina</option><option value="cl">Chile</option>
              <option value="ve">Venezuela</option><option value="ec">Ecuador</option><option value="uy">Uruguay</option>
              <option value="bo">Bolivia</option><option value="py">Paraguay</option><option value="us">Estados Unidos</option>
            </select>
            <button id="addCh" class="rc px-3">+ Canal</button>
          </div>
          <div class="flex items-center gap-3">
            <label for="file" class="cursor-pointer rounded border border-white/20 hover:bg-white/10 px-3 py-1.5 text-sm transition-colors">Subir archivo</label>
            <input id="file" type="file" accept=".m3u,.m3u8,.txt,audio/x-mpegurl,application/vnd.apple.mpegurl" class="sr-only">
            <span id="meta" class="text-xs text-neutral-400 truncate"></span>
          </div>
          <div class="flex gap-2">
            <button id="remoteBtn" class="flex-1 rounded border border-white/20 hover:bg-white/10 px-3 py-1.5 text-sm transition-colors">Enviar a TV</button>
            <button id="tvBtn" class="rounded border border-white/20 hover:bg-white/10 px-3 py-1.5 text-sm transition-colors">Enlace TV</button>
          </div>
        </div>
      </details>

      <p id="msg" role="status" class="hidden text-xs rounded px-3 py-2"></p>

      <div id="tabs" role="tablist" class="flex gap-2 overflow-x-auto scroll pb-1">
        <button role="tab" class="tab" data-tab="0" aria-selected="true">En vivo<span id="c0">0</span></button>
        <button role="tab" class="tab" data-tab="1" aria-selected="false">Películas<span id="c1">0</span></button>
        <button role="tab" class="tab" data-tab="2" aria-selected="false">Series<span id="c2">0</span></button>
        <button role="tab" class="tab" data-tab="3" aria-selected="false">Favoritos<span id="c3">0</span></button>
      </div>

      <input id="search" type="search" placeholder="Buscar canal o categoría" disabled class="w-full rounded bg-neutral-800 border border-white/10 px-3 py-2 text-sm placeholder-neutral-500 focus:border-white/40 focus:outline-none disabled:opacity-40">
    </header>
    <div id="list" class="scroll flex-1 overflow-y-auto pb-[env(safe-area-inset-bottom)]"></div>
  </aside>

  <main class="order-1 lg:order-2 lg:flex-1 shrink-0 min-w-0 flex flex-col bg-black lg:h-full pt-[env(safe-area-inset-top)] lg:pt-0">
    <div id="stage" class="relative aspect-video lg:aspect-auto lg:flex-1 lg:min-h-0 bg-black">
      <video id="video" class="absolute inset-0 w-full h-full object-contain" controls playsinline></video>
      <div id="overlay" class="absolute inset-0 flex items-center justify-center p-6 text-center text-neutral-300 pointer-events-none">
        <p id="overlayText">Elige un canal de la lista para empezar</p>
      </div>
    </div>
    <div id="bar" class="flex items-center gap-3 px-4 py-2 bg-ink border-t border-white/10 min-h-[56px]">
      <div id="nowLogo" class="hidden"></div>
      <div class="min-w-0 flex-1">
        <p id="nowName" class="font-semibold truncate">Sin reproducción</p>
        <p id="nowGroup" class="text-xs text-neutral-400 truncate"></p>
      </div>
      <div id="rc" class="items-center gap-1" style="display:none">
        <button class="rc" data-cmd="toggle">Pausa</button>
        <button class="rc" data-cmd="v-">Vol −</button>
        <button class="rc" data-cmd="v+">Vol +</button>
        <button class="rc" data-cmd="mute">Mute</button>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  const K = { list: 'iptv.player.v2', fav: 'iptv.fav.v2', pos: 'iptv.pos.v2', custom: 'iptv.custom.v2', tv: 'iptv.tvcode', pair: 'iptv.pair' };
  const PAGE = 200, PREFIX = 'iptvtv-';
  const $ = id => document.getElementById(id);
  const video = $('video'), cls = document.body.classList;
  const state = { ch: [], source: '', tab: 0, q: '', cur: -1, open: new Set(), cap: new Map() };
  let fav = new Set(), pos = {}, hls = null, remote = null, now = null, lastSave = 0, ft;

  const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const isHttp = s => /^https?:\/\//i.test(s || '');
  const isTV = () => cls.contains('tv');
  const isOV = () => cls.contains('ov');
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  function say(text, kind) {
    const el = $('msg');
    if (!text) { el.classList.add('hidden'); return; }
    el.textContent = text;
    el.className = 'text-xs rounded px-3 py-2 ' + (kind === 'error' ? 'bg-red-950 text-red-200 border border-red-900' : 'bg-neutral-800 text-neutral-300 border border-white/10');
  }
  function overlay(text) {
    $('overlay').classList.toggle('hidden', !text);
    $('overlayText').textContent = text || '';
  }

  /* ---------- Menú en pantalla (estilo Smart IPTV) ---------- */
  const mq = window.matchMedia('(orientation:landscape) and (max-height:600px)');
  function setMode() {
    const ov = isTV() || mq.matches;
    cls.toggle('ov', ov);
    video.controls = !ov;
    if (!ov) cls.remove('menu', 'info');
  }
  mq.addEventListener ? mq.addEventListener('change', setMode) : mq.addListener(setMode);

  function flash() {
    cls.add('info');
    clearTimeout(ft);
    ft = setTimeout(() => cls.remove('info'), 4000);
  }
  function toggleMenu(force) {
    const open = force === undefined ? !cls.contains('menu') : force;
    cls.toggle('menu', open);
    if (open && isTV()) {
      const a = $('list').querySelector('li.border-nf button[data-i]') || $('list').querySelector('button[data-i],button[data-g]');
      if (a) a.focus();
    }
  }
  $('stage').addEventListener('click', () => { if (isOV()) { toggleMenu(); flash(); } });

  /* ---------- Modelo y parser M3U ---------- */
  const RE_MOV = /pel[ií]cula|movie|film|vod|cine/i, RE_SER = /serie|season|temporada/i;
  function hydrate(n, g, l, u) {
    let t = 0;
    if (/\/series\//i.test(u) || RE_SER.test(g)) t = 2;
    else if (/\/movie\//i.test(u) || RE_MOV.test(g)) t = 1;
    return { n, g, l, u, t, k: (n + ' ' + g).toLowerCase() };
  }
  const custom = () => ls.get(K.custom, []).map(a => hydrate(a[0], a[1], '', a[2]));
  const packList = () => state.ch.map(c => [c.n, c.g, c.l, c.u]);

  function parseM3U(text) {
    const out = [];
    let meta = null, extGrp = '';
    for (const raw of text.split(/\r?\n/)) {
      const l = raw.trim();
      if (!l) continue;
      if (l.startsWith('#EXTINF')) {
        const a = {};
        l.replace(/([\w-]+)="([^"]*)"/g, (_, k, v) => { a[k.toLowerCase()] = v; return ''; });
        const c = l.indexOf(',', Math.max(l.lastIndexOf('"'), 0));
        meta = { n: (c >= 0 ? l.slice(c + 1).trim() : '') || a['tvg-name'] || 'Sin nombre', g: a['group-title'] || '', l: a['tvg-logo'] || '' };
      } else if (l.startsWith('#EXTGRP:')) {
        extGrp = l.slice(8).trim();
      } else if (l[0] === '#') {
        continue;
      } else if (meta || isHttp(l)) {
        const m = meta || { n: l, g: '', l: '' };
        out.push(hydrate(m.n, (m.g || extGrp || 'Sin categoría').trim(), m.l, l));
        meta = null; extGrp = '';
      }
    }
    return out;
  }

  /* ---------- Persistencia ---------- */
  function save() {
    if (!ls.set(K.list, { c: packList(), s: state.source, u: $('url').value.trim() }))
      say('La lista es demasiado grande para guardarla en el navegador. Funcionará hasta que recargues.', 'error');
  }
  function restore() {
    const d = ls.get(K.list, null);
    if (d && Array.isArray(d.c)) {
      state.ch = d.c.map(a => hydrate(a[0], a[1], a[2], a[3]));
      state.source = d.s || '';
      $('url').value = d.u || '';
    }
    fav = new Set(ls.get(K.fav, []));
    pos = ls.get(K.pos, {});
  }

  /* ---------- Carga de listas ---------- */
  function autoTab() {
    const n = [0, 0, 0];
    for (const c of state.ch) n[c.t]++;
    setTab(n[0] ? 0 : n[1] ? 1 : 2);
  }
  function applyList(text, source) {
    const ch = parseM3U(text);
    if (!ch.length) { say('No se encontraron canales. Comprueba que sea una lista M3U válida.', 'error'); return; }
    state.ch = ch.concat(custom()); state.source = source; state.cur = -1;
    state.open = new Set(); state.cap = new Map();
    state.q = ''; $('search').value = '';
    autoTab(); say(''); save(); render();
    $('tools').open = false;
    sendList();
  }
  async function loadFromUrl() {
    const url = $('url').value.trim();
    if (!url) { say('Pega primero la URL de una lista M3U.', 'error'); return; }
    const b = $('load');
    b.disabled = true; b.textContent = 'Cargando…'; say('Descargando lista…');
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      applyList(await r.text(), url);
    } catch (e) {
      say('No se pudo descargar la lista (' + e.message + '). Probablemente el servidor bloquea la petición por CORS. Descarga el archivo y súbelo con "Subir archivo".', 'error');
    } finally { b.disabled = false; b.textContent = 'Cargar'; }
  }
  async function loadFromFile(f) {
    if (!f) return;
    try { applyList(await f.text(), f.name); } catch (e) { say('No se pudo leer el archivo.', 'error'); }
    $('file').value = '';
  }

  /* ---------- Render ---------- */
  function logoHTML(c, s) {
    const k = `h-${s} w-${s} shrink-0 rounded bg-neutral-800 object-contain`;
    return isHttp(c.l)
      ? `<img src="${esc(c.l)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" class="${k}" onerror="this.style.visibility='hidden'">`
      : `<span class="${k} flex items-center justify-center text-xs font-bold text-neutral-500">${esc((c.n[0] || '?').toUpperCase())}</span>`;
  }
  function setTab(t) {
    state.tab = t;
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', +b.dataset.tab === t));
  }
  function countTabs() {
    const n = [0, 0, 0, 0];
    for (const c of state.ch) { n[c.t]++; if (fav.has(c.u)) n[3]++; }
    n.forEach((v, i) => { $('c' + i).textContent = v.toLocaleString('es'); });
    $('meta').textContent = state.ch.length ? state.ch.length.toLocaleString('es') + ' elementos' : '';
  }
  const note = t => `<p class="p-6 text-sm text-neutral-400 leading-relaxed">${t}</p>`;

  function render() {
    const list = $('list'), top = list.scrollTop, has = state.ch.length > 0;
    $('search').disabled = !has;
    $('clear').classList.toggle('hidden', !has);
    countTabs();
    if (!has) { list.innerHTML = note(isTV() ? 'Sin canales. Envía la lista desde tu celular con "Enviar a TV".' : 'Pega la URL de una lista M3U, elige un país o sube un archivo .m3u.'); return; }

    const q = state.q.trim().toLowerCase(), groups = new Map();
    for (let i = 0; i < state.ch.length; i++) {
      const c = state.ch[i];
      if ((state.tab === 3 ? !fav.has(c.u) : c.t !== state.tab) || (q && !c.k.includes(q))) continue;
      let a = groups.get(c.g);
      if (!a) groups.set(c.g, a = []);
      a.push(i);
    }
    if (!groups.size) { list.innerHTML = note(q ? 'Ningún resultado para la búsqueda.' : state.tab === 3 ? 'Aún no tienes favoritos. Toca la estrella de un canal.' : 'No hay contenido en esta pestaña.'); return; }

    const h = [];
    for (const [g, idxs] of groups) {
      const open = q ? true : state.open.has(g);
      h.push(`<section class="border-b border-white/5"><button data-g="${esc(g)}" aria-expanded="${open}" class="w-full flex items-center gap-2 px-4 py-3 text-left hover:bg-white/5 transition-colors">
        <svg class="h-4 w-4 shrink-0 text-neutral-400 transition-transform ${open ? 'rotate-90' : ''}" viewBox="0 0 20 20" fill="currentColor"><path d="M7 5l6 5-6 5V5z"/></svg>
        <span class="flex-1 truncate text-sm font-semibold">${esc(g)}</span><span class="text-xs text-neutral-500">${idxs.length.toLocaleString('es')}</span></button>`);
      if (open) {
        const cap = state.cap.get(g) || PAGE;
        h.push('<ul>');
        for (const i of idxs.slice(0, cap)) {
          const c = state.ch[i], f = fav.has(c.u), on = i === state.cur;
          h.push(`<li class="flex items-center border-l-4 ${on ? 'border-nf bg-white/10' : 'border-transparent'}">
            <button data-i="${i}" class="flex-1 min-w-0 flex items-center gap-3 pl-8 py-3 lg:py-2 text-left text-sm hover:bg-white/10 ${on ? 'text-white' : 'text-neutral-300'}">${logoHTML(c, 8)}<span class="truncate">${esc(c.n)}</span></button>
            <button data-fav="${i}" aria-pressed="${f}" aria-label="Favorito" class="px-4 py-3 text-lg ${f ? 'text-yellow-400' : 'text-neutral-600'} hover:text-yellow-300">★</button></li>`);
        }
        if (idxs.length > cap) h.push(`<li><button data-more="${esc(g)}" class="w-full pl-8 pr-4 py-3 text-left text-xs text-neutral-400 hover:text-white">Ver más (${idxs.length - cap} restantes)</button></li>`);
        h.push('</ul>');
      }
      h.push('</section>');
    }
    list.innerHTML = h.join('');
    list.scrollTop = top;
  }

  /* ---------- Reproducción ---------- */
  function destroyHls() { if (hls) { hls.destroy(); hls = null; } }

  function play(i) {
    const c = state.ch[i];
    if (!c) return;
    state.cur = i;
    if (remote && remote.open) {
      remote.send({ n: c.n, g: c.g, l: c.l, u: c.u, t: c.t });
      $('nowName').textContent = c.n;
      $('nowGroup').textContent = 'En la TV · ' + c.g;
      overlay('Reproduciendo en la TV');
      render();
      return;
    }
    playChannel(c);
  }

  function playChannel(c) {
    destroyHls();
    now = c;
    $('nowName').textContent = c.n;
    $('nowGroup').textContent = c.g;
    const nl = $('nowLogo'); nl.className = 'shrink-0'; nl.innerHTML = logoHTML(c, 10);
    overlay('Cargando…');
    flash();
    render();

    const url = c.u;
    const start = () => video.play().catch(() => {
      if (isTV()) { video.muted = true; video.play().catch(() => {}); }
    });
    const p = c.t ? pos[c.u] : 0;
    if (p > 5) video.addEventListener('loadedmetadata', () => { video.currentTime = p; }, { once: true });
    video.removeAttribute('src'); video.load();

    if (/\.(mp4|webm|ogg|mp3|aac)(\?|$)/i.test(url)) {
      video.src = url; start();
    } else if (window.Hls && Hls.isSupported()) {
      let retries = 0;
      hls = new Hls({ enableWorker: true, backBufferLength: 30, maxBufferLength: 30, manifestLoadingMaxRetry: 2, levelLoadingMaxRetry: 2, fragLoadingMaxRetry: 3 });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, start);
      hls.on(Hls.Events.FRAG_LOADED, () => overlay(''));
      hls.on(Hls.Events.ERROR, (_, d) => {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); return; }
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR && retries++ < 2) { hls.startLoad(); return; }
        destroyHls();
        overlay('No se pudo reproducir este canal. Puede estar caído, bloqueado por CORS o usar http en una página https.');
      });
    } else {
      video.src = url; start();
    }
  }

  video.addEventListener('playing', () => overlay(''));
  video.addEventListener('error', () => { if (now && !hls) overlay('El navegador no pudo reproducir este formato.'); });
  video.addEventListener('timeupdate', () => {
    if (!now || !now.t || Date.now() - lastSave < 5000) return;
    lastSave = Date.now();
    pos[now.u] = Math.floor(video.currentTime);
    const ks = Object.keys(pos);
    if (ks.length > 200) delete pos[ks[0]];
    ls.set(K.pos, pos);
  });

  /* ---------- Eventos de la interfaz ---------- */
  $('load').addEventListener('click', loadFromUrl);
  $('url').addEventListener('keydown', e => { if (e.key === 'Enter') loadFromUrl(); });
  $('file').addEventListener('change', e => loadFromFile(e.target.files[0]));

  $('country').addEventListener('change', e => {
    if (!e.target.value) return;
    $('url').value = 'https://iptv-org.github.io/iptv/countries/' + e.target.value + '.m3u';
    loadFromUrl();
  });

  $('addCh').addEventListener('click', () => {
    const n = (prompt('Nombre del canal') || '').trim();
    if (!n) return;
    const u = (prompt('URL del stream (.m3u8)') || '').trim();
    if (!isHttp(u)) { say('La URL debe empezar por http:// o https://', 'error'); return; }
    const g = (prompt('Categoría', 'Mis canales') || 'Mis canales').trim();
    const cu = ls.get(K.custom, []); cu.push([n, g, u]); ls.set(K.custom, cu);
    state.ch.push(hydrate(n, g, '', u));
    save(); render(); sendList();
    say('Canal agregado a "' + g + '".');
  });

  let t;
  $('search').addEventListener('input', e => {
    clearTimeout(t);
    t = setTimeout(() => { state.q = e.target.value; render(); }, 150);
  });

  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab');
    if (!b) return;
    setTab(+b.dataset.tab);
    $('list').scrollTop = 0;
    render();
  });

  $('list').addEventListener('click', e => {
    const f = e.target.closest('[data-fav]');
    if (f) {
      const u = state.ch[+f.dataset.fav].u;
      fav.has(u) ? fav.delete(u) : fav.add(u);
      ls.set(K.fav, [...fav]);
      render();
      return;
    }
    const c = e.target.closest('[data-i]');
    if (c) { play(+c.dataset.i); if (isOV()) toggleMenu(false); return; }
    const m = e.target.closest('[data-more]');
    if (m) { const g = m.dataset.more; state.cap.set(g, (state.cap.get(g) || PAGE) + PAGE); render(); return; }
    const g = e.target.closest('[data-g]');
    if (g && !state.q.trim()) {
      const k = g.dataset.g;
      state.open.has(k) ? state.open.delete(k) : state.open.add(k);
      render();
      if (isOV()) {
        const b = [...$('list').querySelectorAll('button[data-g]')].find(x => x.dataset.g === k);
        if (b) b.focus();
      }
    }
  });

  $('clear').addEventListener('click', () => {
    if (!confirm('¿Borrar la lista guardada? Tus favoritos y canales propios se conservan.')) return;
    destroyHls(); now = null;
    video.removeAttribute('src'); video.load();
    state.ch = []; state.cur = -1; state.open = new Set(); state.q = '';
    $('search').value = ''; $('url').value = '';
    ls.del(K.list);
    $('nowName').textContent = 'Sin reproducción'; $('nowGroup').textContent = ''; $('nowLogo').className = 'hidden';
    overlay('Elige un canal de la lista para empezar');
    say(''); render();
    $('tools').open = true;
  });

  /* ---------- TV (receptor) y mando (celular) ---------- */
  function command(x) {
    if (x === 'toggle') video.paused ? video.play() : video.pause();
    else if (x === 'mute') video.muted = !video.muted;
    else if (x === 'v+') { video.muted = false; video.volume = Math.min(1, video.volume + 0.1); }
    else if (x === 'v-') { video.muted = false; video.volume = Math.max(0, video.volume - 0.1); }
  }
  function sendList() {
    if (remote && remote.open) remote.send({ list: packList() });
  }

  function startTV(fresh) {
    cls.add('tv'); setMode();
    if (!window.Peer) { overlay('Sin conexión con el servicio de emparejado. Revisa el internet de la TV.'); return; }
    let code = fresh ? '' : ls.get(K.tv, '');
    if (!code) code = String(Math.floor(1000 + Math.random() * 9000));
    ls.set(K.tv, code);
    const peer = new Peer(PREFIX + code);
    peer.on('disconnected', () => peer.reconnect());
    peer.on('open', () => overlay('Código: ' + code + '. En tu celular abre esta misma página, pulsa "Enviar a TV" e introduce el código.' + (state.ch.length ? ' Pulsa OK para abrir el menú de canales.' : '')));
    peer.on('error', e => e.type === 'unavailable-id' ? startTV(true) : overlay('Error de conexión: ' + e.type));
    peer.on('connection', conn => {
      conn.on('open', () => overlay('Celular conectado. Elige un canal en el móvil o pulsa OK para abrir el menú.'));
      conn.on('data', d => {
        if (!d) return;
        if (d.cmd) { command(d.cmd); return; }
        if (d.list) { state.ch = d.list.map(a => hydrate(a[0], a[1], a[2], a[3])); autoTab(); save(); render(); return; }
        if (isHttp(d.u)) {
          const h = hydrate(String(d.n || ''), String(d.g || ''), String(d.l || ''), d.u);
          if (d.t != null) h.t = +d.t;
          playChannel(h);
        }
      });
    });
  }

  function setRemote(c) {
    remote = c;
    $('rc').style.display = c ? 'flex' : 'none';
    $('remoteBtn').textContent = c ? 'Desconectar TV' : 'Enviar a TV';
  }

  $('remoteBtn').addEventListener('click', () => {
    if (remote) {
      const c = remote; setRemote(null); c.close();
      overlay('Elige un canal de la lista para empezar');
      say('Desconectado. Los canales se reproducen en este dispositivo.');
      return;
    }
    if (!window.Peer) { say('No se pudo cargar el servicio de emparejado.', 'error'); return; }
    const code = (prompt('Escribe el código de 4 dígitos que muestra la TV', ls.get(K.pair, '')) || '').trim();
    if (!code) return;
    say('Conectando con la TV…');
    const peer = new Peer();
    const timer = setTimeout(() => { if (!remote) { say('La TV no responde. Revisa el código y que tenga la página abierta.', 'error'); peer.destroy(); } }, 12000);
    peer.on('open', () => {
      const c = peer.connect(PREFIX + code, { reliable: true });
      c.on('open', () => {
        clearTimeout(timer);
        destroyHls(); video.pause(); now = null;
        setRemote(c);
        ls.set(K.pair, code);
        sendList();
        overlay('Conectado a la TV. Elige un canal.');
        say('Conectado. La lista se envió a la TV. Toca un canal para reproducirlo allí.');
        $('tools').open = false;
      });
      c.on('close', () => {
        if (remote !== c) return;
        setRemote(null);
        overlay('Elige un canal de la lista para empezar');
        say('Se perdió la conexión con la TV.', 'error');
      });
    });
    peer.on('error', () => { clearTimeout(timer); say('No se pudo conectar. Revisa el código y que la TV tenga la página abierta.', 'error'); });
  });

  $('rc').addEventListener('click', e => {
    const b = e.target.closest('[data-cmd]');
    if (b && remote) remote.send({ cmd: b.dataset.cmd });
  });

  $('tvBtn').addEventListener('click', async () => {
    if (location.protocol === 'file:') { say('Este archivo está en tu dispositivo. Para abrirlo en la TV, súbelo a un hosting y usa ese enlace.', 'error'); return; }
    const link = location.href.split('#')[0] + '#tv';
    try {
      if (navigator.share) await navigator.share({ title: 'Mi IPTV', url: link });
      else { await navigator.clipboard.writeText(link); say('Enlace copiado: ' + link + ' Ábrelo en el navegador de la TV.'); }
    } catch (e) { say('Abre en la TV: ' + link); }
  });

  /* Mando de la TV: OK abre el menú, flechas navegan, Atrás lo cierra */
  document.addEventListener('keydown', e => {
    if (!isOV()) return;
    const k = e.key, open = cls.contains('menu');
    if (!open) {
      if (k === 'Enter' || k === ' ' || k === 'ArrowLeft') { e.preventDefault(); toggleMenu(true); flash(); }
      else if (k === 'ArrowUp') command('v+');
      else if (k === 'ArrowDown') command('v-');
      return;
    }
    if (k === 'Escape' || k === 'Backspace' || k === 'ArrowRight' || e.keyCode === 10009 || e.keyCode === 461) { e.preventDefault(); toggleMenu(false); return; }
    if (k === 'ArrowDown' || k === 'ArrowUp') {
      e.preventDefault();
      const items = [...$('aside' in window ? document.querySelector('aside') : document).querySelectorAll('.tab,#list button[data-i],#list button[data-g]')];
      let i = items.indexOf(document.activeElement);
      i = k === 'ArrowDown' ? Math.min(items.length - 1, i + 1) : Math.max(0, i - 1);
      if (items[i]) items[i].focus();
    }
  });

  /* ---------- Inicio ---------- */
  restore();
  autoTab();
  render();
  $('tools').open = !state.ch.length;
  setMode();
  if (location.hash === '#tv' || /VIDAA|Hisense|HbbTV|SmartTV/i.test(navigator.userAgent)) startTV();
})();
</script>
</body>
</html>
